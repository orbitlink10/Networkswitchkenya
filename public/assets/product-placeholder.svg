  <rect x="112" y="112" width="256" height="132" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
  <rect x="138" y="142" width="204" height="54" rx="12" fill="url(#device)"/>
  <g fill="#ffffff">
    <rect x="156" y="158" width="26" height="16" rx="3"/>
    <rect x="194" y="158" width="26" height="16" rx="3"/>
    <rect x="232" y="158" width="26" height="16" rx="3"/>
    <rect x="270" y="158" width="26" height="16" rx="3"/>
    <circle cx="318" cy="166" r="5"/>
  </g>
  <g stroke="#0f172a" stroke-width="5" stroke-linecap="round">
    <path d="M166 112V82"/>
    <path d="M314 112V82"/>
