  <text x="240" y="284" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f172a">MikroTik Kenya</text>
  <text x="240" y="314" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#64748b">Image coming soon</text>
