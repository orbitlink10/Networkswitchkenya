<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="title desc">
  <title id="title">MikroTik Kenya product image placeholder</title>
  <desc id="desc">A simple network device illustration used when a product image is unavailable.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="device" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" fill="url(#bg)"/>
  <circle cx="100" cy="82" r="56" fill="#dbeafe" opacity=".75"/>
  <circle cx="392" cy="284" r="68" fill="#fee2e2" opacity=".8"/>
  <g fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round">
